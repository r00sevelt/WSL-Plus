name: WSL-Plus Build Verify

# WSL-Plus CI: 提交到 dev/master → 云端机器编译验证（红/绿）
# 说明: 对齐官方 .pipelines/build-stage.yml 的 target 序列，取核心子集（wsl + wslservice 起步）

on:
  push:
    branches: [master, dev]
  workflow_dispatch:

jobs:
  build-verify:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: "检出代码"
        uses: actions/checkout@v4

      - name: "配置构建参数（低内存、禁用PCH、跳过gluepackage）"
        run: |
          cmake . -A x64 -DWSL_SKIP_GLUE_PACKAGE=ON -DWSL_DISABLE_PCH=ON -DCMAKE_BUILD_TYPE=Release

      - name: "编译 wsl + wslservice（m:2 低并行）"
        run: |
          cmake --build . --config Release --target wsl wslservice -- /m:2

      - name: "产物检查"
        run: |
          Get-ChildItem bin\x64\Release\wsl.exe, bin\x64\Release\wslservice.exe | Select-Object FullName, Length

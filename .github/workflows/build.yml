name: WSL-Plus Build Verify

# WSL-Plus CI: 提交到 dev/master → 云端机器编译验证（红/绿）
# 说明: 对齐官方 .pipelines/build-stage.yml 的 target 序列，取核心子集（wsl + wslservice 起步）

on:
  push:
    branches: [master, dev]
  workflow_dispatch:

# WSL-Plus: 并发控制 —— 新 push 顶掉排队的旧运行（免费计划并发=1，防排队烧分钟）
concurrency:
  group: build-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-verify:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: "检出代码"
        uses: actions/checkout@v5

      - name: "配置构建参数（低内存、禁用PCH、跳过gluepackage）"
        run: |
          cmake . -A x64 -DWSL_SKIP_GLUE_PACKAGE=ON -DWSL_DISABLE_PCH=ON -DCMAKE_BUILD_TYPE=Release

      # WSL-Plus 全链: target=msipackage —— 依赖图自动拉全产品链(wsl/wslg/wslservice/wslhost/wslrelay/
      # proxystubs/init/initramfs/wslc/wslcsession) 并产出 wsl.msi (WiX 由 NuGet 拉取)
      # 包格式红线: 仅 x64 + EXE + MSI；msixgluepackage / msixinstaller / storebroker 一律不引（MSIX 根除）
      - name: "全量编译 + 打包 MSI（m:4 云上满配）"
        run: |
          cmake --build . --config Release --target msipackage -- /m:4

      - name: "产物检查（EXE + MSI）"
        run: |
          Get-ChildItem bin\x64\Release\wsl.exe, bin\x64\Release\wslservice.exe, bin\x64\Release\wsl.msi | Select-Object FullName, Length

      - name: "上传产物（构建成功才执行）"
        if: success()
        uses: actions/upload-artifact@v5
        with:
          name: wslplus-release-x64
          path: |
            bin\x64\Release\wsl.exe
            bin\x64\Release\wslservice.exe
            bin\x64\Release\wsl.msi
